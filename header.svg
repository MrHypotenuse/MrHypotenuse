
<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Raahim Farhan - Full-stack engineer</title>
  <desc id="desc">Animated dark neon banner with a right triangle motif and orbiting particles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060816"/>
      <stop offset="0.48" stop-color="#0C1026"/>
      <stop offset="1" stop-color="#071321"/>
    </linearGradient>
    <linearGradient id="neon" x1="120" y1="90" x2="1080" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#22D3EE;#F472B6;#8B5CF6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#F472B6;#8B5CF6;#22D3EE" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#F472B6">
        <animate attributeName="stop-color" values="#F472B6;#8B5CF6;#22D3EE;#F472B6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#22D3EE" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#A5B4FC" stroke-opacity="0.07"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blurred"/>
      <feMerge><feMergeNode in="blurred"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <circle cx="1020" cy="90" r="250" fill="url(#glow)" filter="url(#blur)">
      <animate attributeName="cx" values="1020;930;1020" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="390" r="180" fill="#8B5CF6" fill-opacity="0.14" filter="url(#blur)"/>

    <g opacity="0.9" filter="url(#softGlow)">
      <path d="M892 92V322H1092" stroke="#22D3EE" stroke-opacity="0.16" stroke-width="2" stroke-linejoin="round"/>
      <path d="M892 92V322H1092Z" stroke="url(#neon)" stroke-width="4" stroke-linejoin="round" stroke-dasharray="760" stroke-dashoffset="760">
        <animate attributeName="stroke-dashoffset" values="760;0;0" keyTimes="0;0.35;1" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M892 292H922V322" stroke="#A5B4FC" stroke-width="3" opacity="0.8"/>
      <path d="M1072 294L914 112" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="5 8">
        <animate attributeName="stroke-dashoffset" values="0;-52" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <circle cx="892" cy="92" r="7" fill="#8B5CF6">
        <animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1092" cy="322" r="7" fill="#F472B6">
        <animate attributeName="r" values="8;5;8" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="892" cy="322" r="7" fill="#22D3EE"/>
    </g>

    <g fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <text x="92" y="112" font-size="18" font-weight="600" letter-spacing="4" fill="#22D3EE">HELLO, WORLD — I'M</text>
      <text x="88" y="205" font-size="74" font-weight="800" letter-spacing="-3">RAAHIM FARHAN</text>
      <rect x="92" y="235" width="550" height="2" rx="1" fill="url(#neon)"/>

      <g font-size="26" font-weight="500">
        <text x="92" y="288" fill="#A5B4FC">Full-stack engineer</text>
        <text x="322" y="288" fill="#64748B">//</text>
        <g>
          <text x="358" y="288" fill="#CBD5E1">shipping production systems</text>
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.27;0.33;0.94;1" dur="9s" repeatCount="indefinite"/>
        </g>
        <g opacity="0">
          <text x="358" y="288" fill="#CBD5E1">building at the edge</text>
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.36;0.60;0.66;1" dur="9s" repeatCount="indefinite"/>
        </g>
        <g opacity="0">
          <text x="358" y="288" fill="#CBD5E1">making complexity disappear</text>
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.63;0.69;0.94;1" dur="9s" repeatCount="indefinite"/>
        </g>
      </g>

      <g font-size="16" font-weight="600" letter-spacing="1.5">
        <rect x="92" y="327" width="190" height="42" rx="21" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.55"/>
        <circle cx="116" cy="348" r="5" fill="#34D399">
          <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="132" y="354" fill="#DDD6FE">TORONTO, CA</text>
        <text x="310" y="354" fill="#64748B">CS @ U OF T</text>
      </g>
    </g>

    <g fill="#A5B4FC">
      <circle cx="740" cy="70" r="2"><animate attributeName="cy" values="70;82;70" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="350" r="3" opacity="0.7"><animate attributeName="cy" values="350;334;350" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="1140" cy="84" r="2" opacity="0.6"><animate attributeName="cy" values="84;98;84" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="710" cy="180" r="2" opacity="0.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="27" stroke="url(#neon)" stroke-opacity="0.35" stroke-width="2"/>
</svg>
